# Deploy to Render: https://render.com
# 1. Connect your GitHub repo
# 2. Render auto-detects this file
# 3. Add your env vars in the Render dashboard

services:
  - type: web
    name: jarvis-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn jarvis.api.server:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: SPOTIFY_ACCESS_TOKEN
        sync: false
      - key: GMAIL_ACCESS_TOKEN
        sync: false
      - key: HOME_ASSISTANT_URL
        sync: false
      - key: HOME_ASSISTANT_TOKEN
        sync: false
